# Served by the local yaklang-web container on 127.0.0.1:8084.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/xml application/javascript
               application/json image/svg+xml application/xml application/wasm;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # 直跳带尾斜杠的 canonical 目标，避免 /docs -> /docs/intro -> /docs/intro/ 两跳链
    location = /docs {
        return 301 /docs/intro/;
    }

    location = /docs/ {
        return 301 /docs/intro/;
    }

    location ~* \.(?:css|js|mjs|map|woff2?|png|jpg|jpeg|gif|webp|avif|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~* ^/(?:robots\.txt|llms\.txt|sitemap\.xml)$ {
        add_header Cache-Control "no-cache" always;
    }

    # HTML 仅在重新部署后变化：短缓存取代 no-cache，命中期内免去回源校验，
    # 资源仍引用内容哈希文件名，过期后浏览器凭 ETag 走 304，部署最多滞后 5 分钟可见。
    location / {
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri $uri/ $uri.html =404;
    }
}
