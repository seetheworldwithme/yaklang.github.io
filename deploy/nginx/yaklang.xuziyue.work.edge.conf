# TLS is terminated by the existing edge-nginx container.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name yaklang.xuziyue.work;

    ssl_certificate     /etc/letsencrypt/live/yaklang.xuziyue.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yaklang.xuziyue.work/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location / {
        proxy_pass http://127.0.0.1:8084;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
