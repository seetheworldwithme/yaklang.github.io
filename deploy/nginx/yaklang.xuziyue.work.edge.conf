# TLS is terminated by the existing edge-nginx container.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name yaklang.xuziyue.work;

    ssl_certificate     /etc/letsencrypt/live/yaklang.xuziyue.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yaklang.xuziyue.work/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # CSP：Docusaurus 注入内联 <script>(__DOCUSAURUS 运行态)，故 script/style 保留 'unsafe-inline'；
    # 生产 bundle 唯一的 new Function 是被 try/catch 兜底的 globalThis polyfill，无需 'unsafe-eval'；
    # 无外部分析埋点，connect 收敛到同源 + https；object/plugins 禁用，frame-ancestors 防嵌套。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; media-src 'self' data: https:; frame-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self' https:; frame-ancestors 'self'" always;

    location / {
        proxy_pass http://127.0.0.1:8084;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
