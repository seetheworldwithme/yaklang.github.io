# Static production vhost for yaklang.xuziyue.work.
# Copy to /etc/nginx/sites-available/ and enable with a same-name symlink.
server {
    listen 80;
    listen [::]:80;
    server_name yaklang.xuziyue.work;

    root /home/ubuntu/application/yaklang.github.io/build;
    index index.html;
    charset utf-8;
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/xml application/javascript
               application/json image/svg+xml application/xml application/wasm;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # This directory route has no generated index page.
    location = /docs {
        return 301 /docs/intro;
    }

    location = /docs/ {
        return 301 /docs/intro;
    }

    # Fingerprinted Docusaurus assets can be cached aggressively.
    location ~* \.(?:css|js|mjs|map|woff2?|png|jpg|jpeg|gif|webp|avif|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Crawler protocol and sitemap files should always reflect the current deploy.
    location ~* ^/(?:robots\.txt|llms\.txt|sitemap\.xml)$ {
        add_header Cache-Control "no-cache" always;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ $uri.html =404;
    }
}
